<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Map</title>
<!--
  mindmap skill standalone template. Self-contained: no external files, fonts or scripts.
  Replace ONLY the JSON inside <script type="application/json" id="data"> (schema: data-schema.md),
  or run: python3 scripts/build_html.py data.json out.html
-->
<style>
  :root {
    --bg: #ffffff; --paper: #f5f5f3; --ink: #1b1b1b; --ink2: #555555; --faint: #8b8b8b;
    --red: #d92d20; --accent: #2f6fed; --border: #e2e2e0; --strong: #c9c9c6; --subtle: #ececea;
    --btn: #ffffff; --btn-hover: #f0f0ee;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --paper: #1d1d1f; --ink: #ededed; --ink2: #b4b4b4; --faint: #8e8e93;
      --red: #ff6b5e; --accent: #6b9bff; --border: #2e2e30; --strong: #48484a; --subtle: #2a2a2c;
      --btn: #1d1d1f; --btn-hover: #2a2a2c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  .summary { color: var(--ink2); margin: 0 0 20px; }
  h2 { font-size: 20px; margin: 28px 0 8px; }
  p.intro { margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  button.b { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--strong); background: var(--btn); color: var(--ink); }
  button.b:hover:not(:disabled) { background: var(--btn-hover); }
  button.b:disabled { opacity: .45; cursor: default; }
  /* mind map */
  svg.map { display: block; width: 100%; height: auto; margin-top: 12px; }
  svg.map text { font-family: inherit; }
  .frame { fill: none; stroke: var(--border); stroke-width: 1; }
  .box { fill: var(--paper); stroke: var(--ink); }
  .ring { fill: none; stroke: var(--red); stroke-width: 1.6; }
  .t-ink { fill: var(--ink); } .t-red { fill: var(--red); } .t-faint { fill: var(--faint); }
  .ln-ink { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
  .ln-faint { fill: none; stroke: var(--faint); stroke-width: 1.3; }
  .ul-red { fill: none; stroke: var(--red); stroke-width: 1.4; stroke-linecap: round; }
  .dot-red { fill: var(--red); } .dot-faint { fill: var(--faint); }
  g.branch { cursor: pointer; } g.branch:focus { outline: none; } g.branch:focus-visible rect { stroke: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="summary" id="summary"></p>
  <section id="panel-map">
    <p class="intro">Key facts and memory hooks. Click a branch to fold or open it.</p>
    <div class="row">
      <button class="b" id="expand">Expand all</button>
      <button class="b" id="collapse">Collapse all</button>
    </div>
    <div id="mapbox" style="width:100%"></div>
  </section>
</main>

<script type="application/json" id="data">
/*DATA_START*/{
  "title": "How HTTPS works",
  "subtitle": "Example dataset written from general knowledge, not from a source document.",
  "root": [
    "How HTTPS",
    "works"
  ],
  "branches": [
    {
      "id": "tls",
      "label": "TLS handshake",
      "anchor": "RFC 8446 · TLS 1.3 (2018)",
      "leaves": [
        {
          "label": "ClientHello",
          "value": "ciphers + key share"
        },
        {
          "label": "ServerHello",
          "value": "picks cipher + key"
        },
        {
          "label": "Certificate",
          "value": "proves server identity"
        },
        {
          "label": "Finished",
          "value": "both verify transcript"
        },
        {
          "label": "1-RTT",
          "value": "one round trip in 1.3"
        }
      ],
      "hook": "hello · cert · keys · finished"
    },
    {
      "id": "crypto",
      "label": "Cryptography",
      "anchor": "Diffie & Hellman 1976",
      "leaves": [
        {
          "label": "ECDHE",
          "value": "ephemeral key exchange"
        },
        {
          "label": "Forward secrecy",
          "value": "old traffic stays safe"
        },
        {
          "label": "AES-GCM",
          "value": "bulk encryption"
        },
        {
          "label": "AEAD",
          "value": "encrypt + authenticate"
        }
      ],
      "hook": "exchange · encrypt · authenticate"
    },
    {
      "id": "pki",
      "label": "Certificates & PKI",
      "anchor": "X.509 certificates",
      "leaves": [
        {
          "label": "CA",
          "value": "signs the server's key"
        },
        {
          "label": "Chain",
          "value": "leaf → intermediate → root"
        },
        {
          "label": "Trust store",
          "value": "roots in OS / browser"
        },
        {
          "label": "SAN",
          "value": "hostnames the cert covers"
        },
        {
          "label": "Revocation",
          "value": "OCSP, CRL"
        }
      ],
      "hook": "leaf · intermediate · root"
    },
    {
      "id": "http",
      "label": "HTTP over TLS",
      "anchor": "Port 443 · https://",
      "leaves": [
        {
          "label": "SNI",
          "value": "hostname in the hello"
        },
        {
          "label": "ALPN",
          "value": "picks h2 or http/1.1"
        },
        {
          "label": "HSTS",
          "value": "force HTTPS next time"
        },
        {
          "label": "HTTP/3",
          "value": "QUIC over UDP"
        }
      ],
      "hook": "SNI · ALPN · HSTS"
    },
    {
      "id": "threats",
      "label": "Threats it stops",
      "anchor": "Model: network attacker",
      "leaves": [
        {
          "label": "Eavesdropping",
          "value": "traffic encrypted"
        },
        {
          "label": "Tampering",
          "value": "AEAD tag fails"
        },
        {
          "label": "Impersonation",
          "value": "cert check fails"
        },
        {
          "label": "Not stopped",
          "value": "hacked endpoint"
        }
      ],
      "hook": "read · change · pretend"
    }
  ]
}/*DATA_END*/
</script>

<script>
(function () {
  "use strict";
  var raw = document.getElementById("data").textContent;
  raw = raw.replace(/\/\*DATA_(START|END)\*\//g, "");
  var DATA = JSON.parse(raw);
  var SVGNS = "http://www.w3.org/2000/svg";

  // ---------- derive model (same rules as the Grok Bot canvas template) ----------
  var MAP = DATA.branches.map(function (b) {
    var leaves = [{ t: b.anchor, r: true }];
    b.leaves.forEach(function (l) { leaves.push({ t: l.value ? l.label + ": " + l.value : l.label }); });
    leaves.push({ t: b.hook, r: true });
    return { id: b.id, label: b.label, leaves: leaves };
  });
  function rootLines() {
    if (DATA.root && DATA.root.length) return DATA.root.slice(0, 2);
    var w = DATA.title.split(" "); if (w.length < 2) return [DATA.title];
    var best = 1, bd = 1e9;
    for (var i = 1; i < w.length; i++) { var df = Math.abs(w.slice(0, i).join(" ").length - w.slice(i).join(" ").length); if (df < bd) { bd = df; best = i; } }
    return [w.slice(0, best).join(" "), w.slice(best).join(" ")];
  }

  document.title = "Mind Map: " + DATA.title;
  document.getElementById("title").textContent = "Mind Map: " + DATA.title;
  document.getElementById("summary").textContent = (DATA.subtitle ? DATA.subtitle + " " : "") +
    "One mind map of " + MAP.length + " branches.";

  // ---------- mind map ----------
  var open = {}; MAP.forEach(function (b) { open[b.id] = true; });
  var mapbox = document.getElementById("mapbox");
  function el(name, attrs, text) {
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  }
  function leafText(parent, lf, x, y) {
    var g = el("g", {});
    g.appendChild(el("text", { x: x, y: y + 4.5, "class": lf.r ? "t-red" : "t-ink", "font-size": 13.5, "font-weight": lf.r ? 600 : 400 }, lf.t));
    if (lf.r) g.appendChild(el("path", { d: "M " + x + " " + (y + 9) + " q " + (lf.t.length * 7) / 2 + " 3 " + lf.t.length * 7 + " 0", "class": "ul-red" }));
    parent.appendChild(g);
  }
  function branchNode(parent, b, x, y, bw, bh) {
    var isOpen = open[b.id];
    var g = el("g", { "class": "branch", role: "button", tabindex: 0, "aria-label": (isOpen ? "Collapse " : "Expand ") + b.label, "aria-expanded": isOpen ? "true" : "false" });
    g.appendChild(el("rect", { x: x, y: y, width: bw, height: bh, rx: 8, "class": "box", "stroke-width": 2 }));
    g.appendChild(el("text", { x: x + 12, y: y + bh / 2 + 5, "class": "t-ink", "font-size": 14, "font-weight": 600 }, (isOpen ? "− " : "+ ") + b.label));
    if (!isOpen) g.appendChild(el("text", { x: x + bw - 10, y: y + bh / 2 + 5, "text-anchor": "end", "class": "t-faint", "font-size": 12 }, String(b.leaves.length)));
    g.addEventListener("click", function () { open[b.id] = !open[b.id]; renderMap(); });
    g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open[b.id] = !open[b.id]; renderMap(); } });
    parent.appendChild(g);
  }
  function renderMap() {
    var w = Math.round(mapbox.getBoundingClientRect().width) || 700;
    var wide = w >= 640, W = Math.max(w, 300), H = 0;
    var svg = el("svg", { "class": "map", role: "img", "aria-label": "Mind map of " + DATA.title });
    var layer = el("g", {});
    if (wide) {
      var rowH = 25, cx = 6, cw = 128, ch = 66, bx = 156, bw = 182, bh = 32, lx = 370;
      var lines = rootLines();
      var longest = Math.max.apply(null, lines.map(function (s) { return s.length; }));
      var rfs = Math.min(15, Math.floor(118 / Math.max(1, longest * 0.58)));
      var y = 14, pos = [];
      MAP.forEach(function (b) {
        var n = open[b.id] ? b.leaves.length : 0, rows = Math.max(1, n), by = y + (rows * rowH) / 2, lv = [];
        for (var j = 0; j < n; j++) lv.push(y + j * rowH + rowH / 2);
        pos.push({ b: b, by: by, leaves: lv }); y += rows * rowH + 12;
      });
      H = y + 4; var cy = H / 2;
      pos.forEach(function (p) {
        layer.appendChild(el("path", { d: "M " + (cx + cw) + " " + cy + " C " + (cx + cw + 16) + " " + cy + ", " + (bx - 16) + " " + p.by + ", " + bx + " " + p.by, "class": "ln-ink" }));
        p.leaves.forEach(function (ly, j) {
          layer.appendChild(el("path", { d: "M " + (bx + bw) + " " + p.by + " C " + (bx + bw + 14) + " " + p.by + ", " + (lx - 24) + " " + ly + ", " + (lx - 10) + " " + ly, "class": "ln-faint" }));
          layer.appendChild(el("circle", { cx: lx - 8, cy: ly, r: 2.6, "class": p.b.leaves[j].r ? "dot-red" : "dot-faint" }));
          leafText(layer, p.b.leaves[j], lx, ly);
        });
        branchNode(layer, p.b, bx, p.by - bh / 2, bw, bh);
      });
      var c = el("g", {});
      c.appendChild(el("rect", { x: cx - 3, y: cy - ch / 2 - 3, width: cw + 6, height: ch + 6, rx: 14, "class": "ring" }));
      c.appendChild(el("rect", { x: cx, y: cy - ch / 2, width: cw, height: ch, rx: 11, "class": "box", "stroke-width": 2.4 }));
      if (lines.length > 1) {
        c.appendChild(el("text", { x: cx + cw / 2, y: cy - 4, "text-anchor": "middle", "class": "t-ink", "font-size": rfs, "font-weight": 700 }, lines[0]));
        c.appendChild(el("text", { x: cx + cw / 2, y: cy + 16, "text-anchor": "middle", "class": "t-ink", "font-size": rfs, "font-weight": 700 }, lines[1]));
      } else {
        c.appendChild(el("text", { x: cx + cw / 2, y: cy + 5, "text-anchor": "middle", "class": "t-ink", "font-size": rfs, "font-weight": 700 }, lines[0]));
      }
      layer.appendChild(c);
    } else {
      var rowH2 = 23, trunkX = 18, bx2 = 34, bw2 = Math.min(190, W - 44), bh2 = 30, lx2 = 72;
      var rw = Math.min(Math.max(DATA.title.length * 8.8 + 28, 160), W - 10);
      var trunk = el("line", { x1: trunkX, y1: 44, x2: trunkX, "class": "ln-ink" });
      layer.appendChild(trunk);
      var c2 = el("g", {});
      c2.appendChild(el("rect", { x: 4, y: 4, width: rw, height: 40, rx: 10, "class": "box", "stroke-width": 2.4 }));
      c2.appendChild(el("text", { x: 16, y: 29, "class": "t-ink", "font-size": 15, "font-weight": 700 }, DATA.title));
      c2.appendChild(el("line", { x1: 14, y1: 46, x2: 14 + Math.min(150, rw - 20), y2: 46, "class": "ul-red", "stroke-width": 1.6 }));
      layer.appendChild(c2);
      var y2 = 58, lastBy = 58;
      MAP.forEach(function (b) {
        var by = y2 + bh2 / 2; lastBy = by;
        layer.appendChild(el("line", { x1: trunkX, y1: by, x2: bx2, y2: by, "class": "ln-ink" }));
        branchNode(layer, b, bx2, y2, bw2, bh2);
        y2 += bh2 + 6;
        if (open[b.id]) {
          var top = y2;
          b.leaves.forEach(function (lf) {
            var ly = y2 + rowH2 / 2;
            layer.appendChild(el("line", { x1: 50, y1: ly, x2: lx2 - 8, y2: ly, "class": "ln-faint" }));
            leafText(layer, lf, lx2, ly);
            y2 += rowH2;
          });
          layer.appendChild(el("line", { x1: 50, y1: top - 6, x2: 50, y2: y2 - rowH2 / 2, "class": "ln-faint" }));
        }
        y2 += 10;
      });
      trunk.setAttribute("y2", lastBy);
      H = y2 + 4;
    }
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.appendChild(el("rect", { x: 0.5, y: 0.5, width: W - 1, height: H - 1, rx: 12, "class": "frame" }));
    svg.appendChild(layer);
    mapbox.innerHTML = ""; mapbox.appendChild(svg);
  }
  document.getElementById("expand").onclick = function () { MAP.forEach(function (b) { open[b.id] = true; }); renderMap(); };
  document.getElementById("collapse").onclick = function () { MAP.forEach(function (b) { open[b.id] = false; }); renderMap(); };
  var lastW = -1;
  function onResize() { var w = Math.round(mapbox.getBoundingClientRect().width); if (w !== lastW) { lastW = w; renderMap(); } }
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(onResize).observe(mapbox); else window.addEventListener("resize", onResize);

  renderMap();
})();
</script>
</body>
</html>
